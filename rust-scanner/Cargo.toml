[package]
name = "codedna-scanner"
version = "0.3.0"
edition = "2021"
authors = ["CodeDNA Contributors"]
license = "MIT"
description = "Fast incremental scanner for CodeDNA - Rust implementation"
name = "codedna-scanner"

[[bin]]
name = "codedna-scanner"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
