<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeDNA Dashboard</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --success: #3fb950;
            --error: #f85149;
            --border: #30363d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 2rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
        h1 { font-size: 1.75rem; font-weight: 600; }
        .status-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px; font-size: 0.875rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
        .status-dot.offline { background: var(--error); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
        .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-value { font-size: 2.5rem; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 0.875rem; color: var(--text-secondary); }
        .repo-list { list-style: none; }
        .repo-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
        .repo-item:last-child { border-bottom: none; }
        .repo-name { font-weight: 500; }
        .repo-lang { font-size: 0.75rem; padding: 0.25rem 0.5rem; background: var(--bg-tertiary); border-radius: 4px; color: var(--text-secondary); }
        .privacy-notice { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-top: 2rem; display: flex; align-items: center; gap: 1rem; }
        .loading { display: flex; align-items: center; justify-content: center; padding: 2rem; color: var(--text-secondary); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-right: 0.75rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 CodeDNA</h1>
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </header>
        <div id="loadingState" class="loading"><div class="spinner"></div><span>Loading dashboard...</span></div>
        <div id="mainContent" style="display: none;">
            <div class="grid">
                <div class="card"><h2>Tracked Repos</h2><div class="stat-value" id="repoCount">0</div><div class="stat-label">repositories</div></div>
                <div class="card"><h2>Total Scans</h2><div class="stat-value" id="scanCount">0</div><div class="stat-label">this week</div></div>
            </div>
            <div class="card">
                <h2>Repository Status</h2>
                <ul class="repo-list" id="repoList"><li class="repo-item"><span class="repo-name">No repositories tracked</span></li></ul>
            </div>
            <div class="privacy-notice">
                <span>🔒</span>
                <div><strong>Privacy First:</strong> All computation happens locally. No code, metrics, or identifiers leave your machine unless you explicitly export data.</div>
            </div>
        </div>
    </div>
    <script>
        const API_BASE = 'http://127.0.0.1:7842/api/v1';
        async function loadDashboard() {
            try {
                const healthResponse = await fetch(`${API_BASE.replace('/api/v1', '')}/health`);
                if (!healthResponse.ok) throw new Error('Daemon not responding');
                document.getElementById('statusDot').classList.remove('offline');
                document.getElementById('statusText').textContent = 'Online';
                const status = await fetch(`${API_BASE}/status`, {headers: {'X-CodeDNA-Client': 'dashboard'}}).then(r => r.json());
                document.getElementById('repoCount').textContent = status.active_repos.length;
                if (status.active_repos.length === 0) {
                    document.getElementById('repoList').innerHTML = '<li class="repo-item"><span class="repo-name">No repositories tracked</span></li>';
                } else {
                    document.getElementById('repoList').innerHTML = status.active_repos.map(repo => `<li class="repo-item"><span class="repo-name">${repo.name}</span><span class="repo-lang">${repo.language}</span></li>`).join('');
                }
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            } catch (error) {
                document.getElementById('statusDot').classList.add('offline');
                document.getElementById('statusText').textContent = 'Offline';
                document.getElementById('loadingState').innerHTML = '<div style="text-align: center; padding: 2rem;"><div style="font-size: 1.5rem; margin-bottom: 1rem;">🚫</div><div style="font-weight: 600;">Daemon Offline</div><div style="color: var(--text-secondary);">Start with: <code>codedna daemon start</code></div></div>';
            }
        }
        loadDashboard();
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
